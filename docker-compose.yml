services:
  oracle-reporting-web:
    container_name: oracle-reporting-web
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-reporting-tool-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      CLIENT_ORIGIN: "*"
      TZ: Asia/Manila
